<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanças</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    /* ── Palette ───────────────────────────────────────────────── */
    :root {
      --bg:         #f5f5f7;
      --surface:    #ffffff;
      --surface2:   #f0f0f2;
      --border:     #e0e0e5;
      --text:       #1a1a2e;
      --text2:      #555570;
      --accent:     #4f46e5;
      --accent-dim: #e8e7ff;
      --amount:     #646476;
      --amount-dim: #f0f0f2;
      --green:      #16a34a;
      --green-dim:  #dcfce7;
      --warn:       #d97706;
      --warn-dim:   #fef3c7;
      --radius:     12px;
      --radius-sm:  8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #0f0f14;
        --surface:    #1a1a24;
        --surface2:   #22222e;
        --border:     #2e2e40;
        --text:       #e8e8f0;
        --text2:      #8888a8;
        --accent:     #7c76f5;
        --accent-dim: #1e1b4b;
        --amount:     #8888a0;
        --amount-dim: #22222e;
        --green:      #4ade80;
        --green-dim:  #052e16;
        --warn:       #fbbf24;
        --warn-dim:   #292000;
      }
    }

    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { cursor: pointer; font-family: inherit; font-size: inherit; }

    /* ── Token screen ───────────────────────────────────────────── */
    #token-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #token-screen.visible { display: flex; }
    .token-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 420px;
      width: 90%;
    }
    .token-card h1 { font-size: 1.25rem; margin-bottom: .5rem; }
    .token-card p { color: var(--text2); font-size: .875rem; margin-bottom: 1.25rem; line-height: 1.6; }
    .token-card input {
      width: 100%;
      padding: .6rem .8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text);
      font-family: monospace;
      font-size: .875rem;
      margin-bottom: .75rem;
      outline: none;
    }
    .token-card input:focus { border-color: var(--accent); }
    .btn-primary {
      width: 100%;
      padding: .65rem 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      letter-spacing: .01em;
    }
    .btn-primary:hover { opacity: .88; }
    #token-error {
      color: var(--danger);
      font-size: .8rem;
      margin-top: .5rem;
      min-height: 1.2em;
    }

    /* ── App shell ──────────────────────────────────────────────── */
    #app { display: none; }
    #app.visible { display: block; }

    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .app-header h1 { font-size: 1.1rem; font-weight: 700; }
    .header-meta { color: var(--text2); font-size: .8rem; }

    .header-actions { display: flex; align-items: center; gap: .75rem; }
    .btn-ghost {
      padding: .35rem .75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text2);
      font-size: .8rem;
    }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }

    /* ── Month filter ───────────────────────────────────────────── */
    #month-filter {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .75rem 1.5rem;
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .month-btn {
      padding: .3rem .75rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--text2);
      font-size: .82rem;
      transition: all .12s;
    }
    .month-btn:hover { border-color: var(--accent); color: var(--accent); }
    .month-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* ── Main layout ────────────────────────────────────────────── */
    .app-body {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 0;
      min-height: calc(100vh - 120px);
    }
    @media (max-width: 900px) {
      .app-body { grid-template-columns: 1fr; }
    }

    /* ── Left panel ─────────────────────────────────────────────── */
    #main-panel {
      padding: 1.25rem 1.5rem;
      min-width: 0;
    }

    /* ── Breadcrumb ─────────────────────────────────────────────── */
    #breadcrumb {
      display: flex;
      align-items: center;
      gap: .75rem;
      font-size: .82rem;
      color: var(--text2);
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    #breadcrumb .back-btn {
      padding: 0;
      border: none;
      background: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      flex-shrink: 0;
    }
    #breadcrumb .back-btn:hover { opacity: .7; }
    #breadcrumb .crumbs { display: flex; align-items: center; gap: .4rem; }
    #breadcrumb .crumb { color: var(--accent); cursor: pointer; }
    #breadcrumb .crumb:hover { text-decoration: underline; }
    #breadcrumb .crumb-sep { color: var(--border); }
    #breadcrumb .crumb-current { color: var(--text); font-weight: 600; }

    /* ── Category cards ─────────────────────────────────────────── */
    #period-total {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--amount);
      margin-bottom: 1.25rem;
    }
    #period-total .label {
      font-size: .8rem;
      font-weight: 400;
      color: var(--text2);
      display: block;
      margin-bottom: .15rem;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: .75rem;
    }
    .category-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      cursor: pointer;
      transition: border-color .12s, box-shadow .12s;
      position: relative;
    }
    .category-card:hover {
      border-color: var(--accent);
      box-shadow: 0 2px 12px rgba(79,70,229,.1);
    }
    .category-card .cat-name {
      font-size: .82rem;
      color: var(--text2);
      margin-bottom: .3rem;
      display: flex;
      align-items: center;
      gap: .35rem;
    }
    .category-card .cat-total {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--amount);
    }
    .category-card .cat-total.positive { color: var(--green); }
    .category-card .cat-count {
      font-size: .75rem;
      color: var(--text2);
      margin-top: .2rem;
    }

    /* ── Merchant list ──────────────────────────────────────────── */
    .list-header {
      font-size: .8rem;
      color: var(--text2);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: .75rem;
    }
    .merchant-list, .tx-table-wrap { }
    .merchant-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .65rem .9rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: .45rem;
      cursor: pointer;
      transition: border-color .12s;
      gap: .75rem;
    }
    .merchant-row:hover { border-color: var(--accent); }
    .merchant-row .m-name {
      font-weight: 500;
      font-size: .92rem;
      display: flex;
      align-items: center;
      gap: .4rem;
      flex: 1;
      min-width: 0;
    }
    .merchant-row .m-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .merchant-row .m-right {
      display: flex;
      align-items: center;
      gap: .75rem;
      flex-shrink: 0;
    }
    .merchant-category-select {
      padding: .35rem .5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
      color: var(--text);
      font-size: .8rem;
      cursor: pointer;
      outline: none;
    }
    .merchant-category-select:hover { border-color: var(--accent); }
    .merchant-category-select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
    .merchant-row .m-count { font-size: .75rem; color: var(--text2); }
    .merchant-row .m-total { font-weight: 700; color: var(--amount); font-size: .95rem; }
    .merchant-row .m-total.positive { color: var(--green); }

    /* ── Transactions table ─────────────────────────────────────── */
    .tx-table-wrap { overflow-x: auto; }
    .tx-desc-input {
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: .85rem;
      font-family: inherit;
      width: 100%;
      outline: none;
      padding: 0;
    }
    .tx-desc-input:focus { border-bottom: 1px solid var(--accent); color: var(--text); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .875rem;
    }
    thead th {
      text-align: left;
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text2);
      padding: .5rem .75rem;
      border-bottom: 2px solid var(--border);
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td {
      padding: .55rem .75rem;
      vertical-align: middle;
    }
    tbody tr.is-refund { background: var(--green-dim); }
    .amount-neg { color: var(--amount); font-weight: 600; font-variant-numeric: tabular-nums; }
    .amount-pos { color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums; }
    .refund-badge {
      display: inline-block;
      font-size: .68rem;
      font-weight: 600;
      background: var(--green-dim);
      color: var(--green);
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: .35rem;
      vertical-align: middle;
    }
    .tx-date { color: var(--text2); font-size: .82rem; white-space: nowrap; }

    /* ── Warning badge ──────────────────────────────────────────── */
    .warn-badge { font-size: .85rem; cursor: help; flex-shrink: 0; }
    .warn-tooltip {
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--warn);
      border-radius: var(--radius-sm);
      padding: .6rem .85rem;
      font-size: .8rem;
      color: var(--text);
      max-width: 280px;
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
      z-index: 1000;
      pointer-events: none;
      line-height: 1.5;
    }

    /* ── Priorities sidebar ─────────────────────────────────────── */
    #priorities-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 1.25rem;
      overflow-y: auto;
    }
    @media (max-width: 900px) {
      #priorities-panel {
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }
    #priorities-panel h2 {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text2);
      margin-bottom: 1rem;
    }
    .priority-item {
      display: flex;
      gap: .75rem;
      margin-bottom: 1rem;
    }
    .priority-rank {
      flex-shrink: 0;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: .75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: .1rem;
    }
    .priority-body {}
    .priority-title { font-weight: 600; font-size: .875rem; margin-bottom: .2rem; }
    .priority-detail { font-size: .78rem; color: var(--text2); line-height: 1.5; }

    /* ── Loading / error states ─────────────────────────────────── */
    .state-loading, .state-error {
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--text2);
    }
    .state-error { color: var(--danger); }
    .spinner {
      display: inline-block;
      width: 1.5rem;
      height: 1.5rem;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: .75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ─────────────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 1.25rem;
      font-size: .75rem;
      color: var(--text2);
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--text2); }
    footer a:hover { color: var(--accent); }

    /* ── Grouping toggle ────────────────────────────────────────── */
    .grouping-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 1.25rem;
    }
    .grouping-btn {
      padding: .35rem .9rem;
      background: transparent;
      border: none;
      border-radius: 0;
      color: var(--text2);
      font-size: .82rem;
      font-weight: 500;
      transition: background .12s, color .12s;
    }
    .grouping-btn + .grouping-btn {
      border-left: 1px solid var(--border);
    }
    .grouping-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .grouping-btn:hover:not(.active) { background: var(--surface2); color: var(--text); }
    .merchant-category-tag {
      font-size: .72rem;
      color: var(--text2);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Pie chart ──────────────────────────────────────────────── */
    .pie-chart-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 2rem;
    }
    .pie-chart-wrap svg { flex-shrink: 0; display: block; }
    .pie-legend {
      display: flex;
      flex-direction: column;
      gap: .45rem;
      flex: 1;
      min-width: 0;
    }
    .pie-legend-item {
      display: flex;
      align-items: center;
      gap: .55rem;
      font-size: .82rem;
      line-height: 1.3;
    }
    .pie-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .pie-legend-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    .pie-legend-amount {
      font-weight: 600;
      color: var(--amount);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-size: .82rem;
    }
    .pie-legend-pct {
      color: var(--text2);
      font-size: .75rem;
      white-space: nowrap;
      min-width: 2.5rem;
      text-align: right;
    }
    @media (max-width: 600px) {
      .pie-chart-wrap { flex-direction: column; align-items: flex-start; }

      /* Merchant rows: wrap so name is always visible on mobile */
      .merchant-row {
        flex-wrap: wrap;
        gap: .4rem .75rem;
      }
      .merchant-row .m-name {
        width: 100%;
        flex: none;
        min-width: 0;
      }
      .merchant-row .m-right {
        flex-shrink: 1;
        flex-wrap: wrap;
        gap: .4rem .6rem;
      }
      .merchant-category-select {
        max-width: 180px;
      }
    }

    /* ── Tab bar ────────────────────────────────────────────────── */
    #tab-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      gap: 0;
    }
    .tab-btn {
      padding: .75rem 1.25rem;
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: .875rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color .12s, border-color .12s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }

    /* ── Analysis panel ──────────────────────────────────────────── */
    #analysis-panel {
      display: none;
      padding: 1.5rem;
      max-width: 860px;
    }
    #analysis-panel.visible { display: block; }

    .analysis-section { margin-bottom: 2rem; }
    .analysis-section h2 {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text2);
      margin-bottom: .9rem;
    }
    .analysis-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .9rem 1.1rem;
      margin-bottom: .55rem;
    }
    .analysis-card-title { font-weight: 600; font-size: .9rem; margin-bottom: .25rem; }
    .analysis-card-detail { font-size: .82rem; color: var(--text2); line-height: 1.55; }

    .subs-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .subs-table th {
      text-align: left;
      padding: .5rem .75rem;
      color: var(--text2);
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1px solid var(--border);
    }
    .subs-table td {
      padding: .6rem .75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .subs-table tr:last-child td { border-bottom: none; }
    .verdict-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: .72rem;
      font-weight: 600;
    }
    .verdict-keep { background: var(--green-dim); color: var(--green); }
    .verdict-review { background: var(--warn-dim); color: var(--warn); }
    .verdict-unused { background: #fee2e2; color: #dc2626; }
    @media (prefers-color-scheme: dark) {
      .verdict-unused { background: #3f0f0f; color: #f87171; }
    }

    .flag-card {
      background: var(--warn-dim);
      border: 1px solid var(--warn);
      border-radius: var(--radius-sm);
      padding: .75rem 1rem;
      margin-bottom: .5rem;
      font-size: .85rem;
    }
    .flag-card-title { font-weight: 600; margin-bottom: .2rem; }
    .flag-card-body { color: var(--text2); line-height: 1.5; }

    /* ── Tab date bars ───────────────────────────────────────────── */
    #gastos-date-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: .45rem 1.5rem;
      font-size: .78rem;
      color: var(--text2);
    }
    .analysis-date-bar {
      font-size: .78rem;
      color: var(--text2);
      margin-bottom: 1.25rem;
    }

    /* ── Rich analysis report ────────────────────────────────────── */
    .analysis-header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.4rem;
      margin-bottom: 1.5rem;
    }
    .analysis-header .meta {
      font-size: .78rem;
      color: var(--text2);
      margin-bottom: .5rem;
    }
    .analysis-header .takeaway {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.45;
    }
    .overview-table, .evolution-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .82rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .overview-table th, .evolution-table th {
      text-align: left;
      padding: .55rem .75rem;
      color: var(--text2);
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .overview-table td, .evolution-table td {
      padding: .55rem .75rem;
      border-bottom: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    .overview-table tr:last-child td, .evolution-table tr:last-child td { border-bottom: none; }
    .overview-table .num, .evolution-table .num { text-align: right; }
    .narrative-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.3rem;
      margin-bottom: .75rem;
    }
    .narrative-card h3 {
      font-size: .95rem;
      margin-bottom: .6rem;
      display: flex;
      align-items: baseline;
      gap: .5rem;
    }
    .narrative-card h3 .total {
      font-size: .8rem;
      color: var(--text2);

<body>

<!-- ── Token screen ───────────────────────────────────────────────── -->
<div id="token-screen">
  <div class="token-card">
    <h1>Finanças</h1>
    <p>
      Para aceder aos dados precisas de um
      <a href="https://github.com/settings/tokens/new?scopes=gist&description=finance-dashboard" target="_blank" rel="noopener">GitHub Personal Access Token</a>
      com scope <code>gist</code>. O token fica guardado localmente no browser.
    </p>
    <input
      id="token-input"
      type="password"
      placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
      autocomplete="off"
      spellcheck="false"
    />
    <button class="btn-primary" onclick="saveToken()">Guardar e carregar</button>
    <div id="token-error"></div>
  </div>
</div>

<!-- ── App ───────────────────────────────────────────────────────── -->
<div id="app">
  <header class="app-header">
    <div>
      <h1>Finanças</h1>
      <span class="header-meta" id="header-meta"></span>
    </div>
    <div class="header-actions">
      <button class="btn-ghost" onclick="loadData()" title="Recarregar dados do Gist">↻ Atualizar</button>
      <button class="btn-ghost" onclick="clearToken()">Mudar token</button>
    </div>
  </header>

  <nav id="tab-bar"></nav>

  <div id="gastos-date-bar" style="display:none"></div>

  <nav id="month-filter"></nav>

  <div id="app-body" class="app-body">
    <main id="main-panel"></main>
    <aside id="priorities-panel"></aside>
  </div>

  <div id="analysis-panel"></div>

  <footer>
    Dados actualizados em <span id="footer-date">—</span> ·
    <a href="#" onclick="clearToken(); return false;">Mudar token</a>
  </footer>
</div>

<!-- ── Tooltip ───────────────────────────────────────────────────── -->
<div class="warn-tooltip" id="tooltip" style="display:none"></div>

<script>
// ────────────────────────────────────────────────────────────────────
// CONFIG — set GIST_ID after running the export script for the first time
// ────────────────────────────────────────────────────────────────────
const GIST_ID = '1315a80df7f46d8985fa3fa50548705f';
const EDITS_GIST_ID = '565438afdc33a431fedd9067ea668c51';

// ────────────────────────────────────────────────────────────────────
// State
// ────────────────────────────────────────────────────────────────────
const state = {
  token: null,
  data: null,
  edits: {},         // { "2026-01|Apple": "Subscrições", ... }
  descriptions: {},  // { "2026-01-15|Glovo|-12.50": "Jantar com a Sofia", ... }
  activeMonth: 'Todos',
  activeTab: 'gastos',  // 'gastos' | 'analise'
  view: 'categories',   // 'categories' | 'all-merchants' | 'merchants' | 'transactions'
  activeCategory: null,
  activeMerchant: null,
  grouping: 'categories',  // 'categories' | 'all-merchants'
};

// ────────────────────────────────────────────────────────────────────
// Chart helpers — pure SVG donut, no external deps
// ────────────────────────────────────────────────────────────────────
const CATEGORY_COLORS = {
  'Viagem':               '#4361ee',
  'Entrust':              '#7209b7',
  'Compras':              '#f72585',
  'Roupa':                '#ff6b9d',
  'Cuidados Casa':        '#52b788',
  'Mercado':              '#4cc9f0',
  'Restaurantes':         '#f4a261',
  'Restaurantes Delivery':'#e76f51',
  'Hobbies e Desporto':   '#2a9d8f',
  'Subscrições':          '#e9c46a',
  'Serviços Online':      '#457b9d',
  'Carro':                '#6c757d',
  'Outro transporte':     '#adb5bd',
  'Doação':               '#80b918',
  'Despesas casa':        '#0077b6',
  'Saúde':                '#ef233c',
  'Gatinhos':             '#ff9f1c',
  'Transferencias':       '#b5838d',
};

const MERCHANT_PALETTE = [
  '#4361ee','#f72585','#4cc9f0','#f4a261','#2a9d8f',
  '#e9c46a','#457b9d','#7209b7','#e76f51','#80b918',
  '#0077b6','#ef233c','#ff9f1c','#b5838d','#6c757d','#adb5bd',
];

// ── Emoji helper ──────────────────────────────────────────────────────
function catLabel(cat) {
  const emojis = state.data?.category_emojis ?? {};
  const emoji = emojis[cat];
  return emoji ? `${emoji} ${cat}` : cat;
}

function _formatEuroSimple(n) {
  return '€' + Math.abs(n).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function _buildDonutPaths(slices) {
  const cx = 100, cy = 100, R = 90, r = 52;
  const total = slices.reduce((s, x) => s + x.value, 0);
  if (total === 0) return [];
  let angle = -Math.PI / 2;
  return slices.map(s => {
    const sweep = (s.value / total) * 2 * Math.PI;
    const gap = sweep > 0.05 ? 0.013 : 0;
    const a0 = angle + gap;
    const a1 = angle + sweep - gap;
    const large = sweep > Math.PI ? 1 : 0;
    const cos = Math.cos, sin = Math.sin;
    const fmt = n => n.toFixed(3);
    const d = [
      `M ${fmt(cx + R*cos(a0))} ${fmt(cy + R*sin(a0))}`,
      `A ${R} ${R} 0 ${large} 1 ${fmt(cx + R*cos(a1))} ${fmt(cy + R*sin(a1))}`,
      `L ${fmt(cx + r*cos(a1))} ${fmt(cy + r*sin(a1))}`,
      `A ${r} ${r} 0 ${large} 0 ${fmt(cx + r*cos(a0))} ${fmt(cy + r*sin(a0))}`,
      'Z'
    ].join(' ');
    const result = { ...s, d, pct: s.value / total };
    angle += sweep;
    return result;
  });
}

function _renderPieChart(containerId, slices) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (!slices.length) { container.innerHTML = ''; return; }

  const paths = _buildDonutPaths(slices);

  const pathsSVG = paths.map(p => {
    const tip = `${p.label}: ${_formatEuroSimple(p.value)} (${(p.pct * 100).toFixed(1)}%)`;
    return `<path d="${p.d}" fill="${p.color}"
      data-tip="${tip.replace(/"/g, '&quot;')}"
      style="opacity:.88;transition:opacity .15s;cursor:default"
      onmouseenter="this.style.opacity='1';showTooltip(this.dataset.tip,event)"
      onmouseleave="this.style.opacity='.88';hideTooltip()" />`;
  }).join('');

  const legendItems = paths.map(p => `
    <div class="pie-legend-item">
      <div class="pie-legend-dot" style="background:${p.color}"></div>
      <span class="pie-legend-label" title="${p.label}">${p.label}</span>
      <span class="pie-legend-amount">${_formatEuroSimple(p.value)}</span>
      <span class="pie-legend-pct">${(p.pct * 100).toFixed(0)}%</span>
    </div>`).join('');

  container.innerHTML = `
    <svg viewBox="0 0 200 200" width="200" height="200" style="overflow:visible">
      ${pathsSVG}
    </svg>
    <div class="pie-legend">${legendItems}</div>`;
}

function drawCategoryPie(sorted) {
  const slices = sorted
    .filter(([, d]) => d.total < 0)
    .map(([cat, d]) => ({ label: catLabel(cat), value: Math.abs(d.total), color: CATEGORY_COLORS[cat] ?? '#999' }));
  _renderPieChart('cat-pie-container', slices);
}

function drawMerchantPie(merchants) {
  const slices = [...merchants]
    .filter(m => m.total < 0)
    .sort((a, b) => Math.abs(b.total) - Math.abs(a.total))
    .map((m, i) => ({ label: m.merchant, value: Math.abs(m.total), color: MERCHANT_PALETTE[i % MERCHANT_PALETTE.length] }));
  _renderPieChart('merchant-pie-container', slices);
}

// ────────────────────────────────────────────────────────────────────
// Utils
// ────────────────────────────────────────────────────────────────────
function formatEuro(n) {
  const abs = Math.abs(n);
  const formatted = abs.toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? '-' : '') + '€' + formatted;
}

function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function formatMonth(key) {
  return state.data?.period?.month_labels?.[key] ?? key;
}

function formatDatePt(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('pt-PT', { day: 'numeric', month: 'long', year: 'numeric' });
}

function getEditKey(month, merchant) {
  return `${month}|${merchant}`;
}

function getCategoryForMerchant(month, merchant, originalCategory) {
  const key = getEditKey(month, merchant);
  return state.edits[key] ?? originalCategory;
}

async function saveEditToGist(month, merchant, newCategory) {
  const key = getEditKey(month, merchant);
  state.edits[key] = newCategory;

  const payload = { edits: state.edits, descriptions: state.descriptions };
  const headers = {
    "Authorization": `token ${state.token}`,
    "Accept": "application/vnd.github+json",
  };

  try {
    const res = await fetch(`https://api.github.com/gists/${EDITS_GIST_ID}`, {
      method: "PATCH",
      headers,
      body: JSON.stringify({
        files: {
          "category_edits.json": {
            content: JSON.stringify(payload, null, 2)
          }
        }
      })
    });
    if (!res.ok) console.error("Failed to save edit:", res.status);
  } catch (err) {
    console.error("Error saving edit:", err);
  }
}

function getTxKey(tx) {
  return `${tx.date}|${tx.description}|${tx.amount}`;
}

async function saveTxDescriptionToGist(tx, description) {
  const key = getTxKey(tx);
  if (description.trim()) {
    state.descriptions[key] = description.trim();
  } else {
    delete state.descriptions[key];
  }
  const payload = { edits: state.edits, descriptions: state.descriptions };
  try {
    const res = await fetch(`https://api.github.com/gists/${EDITS_GIST_ID}`, {
      method: 'PATCH',
      headers: { 'Authorization': `token ${state.token}`, 'Accept': 'application/vnd.github+json' },
      body: JSON.stringify({ files: { 'category_edits.json': { content: JSON.stringify(payload, null, 2) } } })
    });
    if (!res.ok) console.error('Failed to save description:', res.status);
  } catch (err) {
    console.error('Error saving description:', err);
  }
}

function getMerchantWarning(merchantName) {
  if (!state.data?.flagged_merchants) return null;
  const lower = merchantName.toLowerCase();
  for (const entry of state.data.flagged_merchants) {
    const matchStr = entry.match ?? entry.merchant ?? '';
    if (matchStr && lower.includes(matchStr.toLowerCase())) return entry.warning;
  }
  return null;
}

function getCategoryWarning(categoryName) {
  if (!state.data?.flagged_categories) return null;
  const entry = state.data.flagged_categories.find(
    e => e.category?.toLowerCase() === categoryName.toLowerCase()
  );
  return entry ? entry.warning : null;
}

function el(id) { return document.getElementById(id); }

function setHTML(id, html) { el(id).innerHTML = html; }

// ────────────────────────────────────────────────────────────────────
// Tooltip
// ────────────────────────────────────────────────────────────────────
function showTooltip(text, event) {
  const tip = el('tooltip');
  tip.textContent = text;
  tip.style.display = 'block';
  positionTooltip(event);
}

function positionTooltip(event) {
  const tip = el('tooltip');
  const x = event.clientX + 14;
  const y = event.clientY + 14;
  const maxX = window.innerWidth - tip.offsetWidth - 16;
  const maxY = window.innerHeight - tip.offsetHeight - 16;
  tip.style.left = Math.min(x, maxX) + 'px';
  tip.style.top = Math.min(y, maxY) + 'px';
}

function hideTooltip() {
  el('tooltip').style.display = 'none';
}

document.addEventListener('mousemove', e => {
  if (el('tooltip').style.display !== 'none') positionTooltip(e);
});

// ────────────────────────────────────────────────────────────────────
// Auth
// ────────────────────────────────────────────────────────────────────
function showTokenScreen(errorMsg) {
  el('token-screen').classList.add('visible');
  el('app').classList.remove('visible');
  el('token-error').textContent = errorMsg || '';
}

function clearToken() {
  localStorage.removeItem('gh_token');
  state.token = null;
  state.data = null;
  showTokenScreen();
}

function saveToken() {
  const val = el('token-input').value.trim();
  if (!val) { el('token-error').textContent = 'Introduz um token.'; return; }
  localStorage.setItem('gh_token', val);
  state.token = val;
  el('token-error').textContent = '';
  loadData();
}

el('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveToken();
});

// ────────────────────────────────────────────────────────────────────
// Data loading
// ────────────────────────────────────────────────────────────────────
async function loadData() {
  if (GIST_ID === 'REPLACE_WITH_YOUR_GIST_ID') {
    el('main-panel').innerHTML = `
      <div class="state-error">
        <p>O Gist ID ainda não foi configurado.</p>
        <p style="font-size:.85rem; margin-top:.5rem; color:var(--text2)">
          Corre o script de exportação e substitui <code>REPLACE_WITH_YOUR_GIST_ID</code>
          no ficheiro <code>index.html</code>.
        </p>
      </div>`;
    el('token-screen').classList.remove('visible');
    el('app').classList.add('visible');
    return;
  }

  el('token-screen').classList.remove('visible');
  el('app').classList.add('visible');
  el('main-panel').innerHTML = `<div class="state-loading"><div class="spinner"></div><br>A carregar dados…</div>`;

  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      headers: {
        'Authorization': `token ${state.token}`,
        'Accept': 'application/vnd.github+json',
      }
    });

    if (res.status === 401) {
      localStorage.removeItem('gh_token');
      showTokenScreen('Token inválido ou expirado. Gera um novo em github.com/settings/tokens.');
      return;
    }
    if (res.status === 404) {
      el('main-panel').innerHTML = `<div class="state-error">Gist não encontrado. Verifica o GIST_ID no index.html.</div>`;
      return;
    }
    if (!res.ok) {
      el('main-panel').innerHTML = `<div class="state-error">Erro ${res.status} ao carregar o Gist.</div>`;
      return;
    }

    const gist = await res.json();
    const fileContent = gist.files?.['finance_data.json']?.content;
    if (!fileContent) {
      el('main-panel').innerHTML = `<div class="state-error">Ficheiro finance_data.json não encontrado no Gist.</div>`;
      return;
    }

    state.data = JSON.parse(fileContent);

    // Load edits from the edits Gist
    try {
      const editsRes = await fetch(`https://api.github.com/gists/${EDITS_GIST_ID}`, {
        headers: {
          'Authorization': `token ${state.token}`,
          'Accept': 'application/vnd.github+json',
        }
      });
      if (editsRes.ok) {
        const editsGist = await editsRes.json();
        const editsContent = editsGist.files?.['category_edits.json']?.content;
        if (editsContent) {
          const editsData = JSON.parse(editsContent);
          state.edits = editsData.edits ?? {};
          state.descriptions = editsData.descriptions ?? {};
        }
      }
    } catch (err) {
      console.warn("Could not load edits Gist:", err.message);
    }

    const now = new Date();
    const currentKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const months = state.data?.period?.months ?? [];
    state.activeMonth = months.includes(currentKey) ? currentKey : (months[months.length - 1] ?? 'Todos');
    state.grouping = 'categories';
    state.view = 'categories';
    state.activeCategory = null;
    state.activeMerchant = null;

    // Update footer date
    if (state.data.generated_at) {
      const d = new Date(state.data.generated_at);
      el('footer-date').textContent = d.toLocaleDateString('pt-PT', {
        day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    }

    render();
  } catch (err) {
    el('main-panel').innerHTML = `<div class="state-error">Erro ao carregar: ${err.message}</div>`;
  }
}

// ────────────────────────────────────────────────────────────────────
// Render orchestrator
// ────────────────────────────────────────────────────────────────────
function render() {
  renderTabBar();
  renderHeaderMeta();
  const isGastos = state.activeTab === 'gastos';
  el('month-filter').style.display = isGastos ? '' : 'none';
  el('app-body').style.display = isGastos ? '' : 'none';
  const gastosBar = el('gastos-date-bar');
  if (isGastos && state.data?.last_updated) {
    gastosBar.style.display = '';
    gastosBar.textContent = 'Última atualização: ' + formatDatePt(state.data.last_updated);
  } else {
    gastosBar.style.display = 'none';
  }
  if (isGastos) {
    el('analysis-panel').classList.remove('visible');
    renderMonthFilter();
    renderPrioritiesPanel();
    renderMainPanel();
  } else {
    el('analysis-panel').classList.add('visible');
    renderAnalysisPanel();
  }
}

function setTab(tab) {
  state.activeTab = tab;
  render();
}

function renderTabBar() {
  const tabs = [
    { id: 'gastos', label: 'Gastos' },
    { id: 'analise', label: 'Análise' },
  ];
  el('tab-bar').innerHTML = tabs.map(t =>
    `<button class="tab-btn${state.activeTab === t.id ? ' active' : ''}" onclick="setTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function renderHeaderMeta() {
  const p = state.data?.period;
  if (!p) return;
  const from = formatMonth(p.from);
  const to = formatMonth(p.to);
  el('header-meta').textContent = from === to ? from : `${from} – ${to}`;
}

// ────────────────────────────────────────────────────────────────────
// Month filter
// ────────────────────────────────────────────────────────────────────
function renderMonthFilter() {
  const months = state.data?.period?.months ?? [];
  const buttons = ['Todos', ...months].map(m => {
    const label = m === 'Todos' ? 'Todos' : formatMonth(m);
    const active = state.activeMonth === m ? ' active' : '';
    return `<button class="month-btn${active}" onclick="setMonth('${m}')">${label}</button>`;
  });
  el('month-filter').innerHTML = buttons.join('');
}

function setMonth(month) {
  state.activeMonth = month;
  state.view = state.grouping;
  state.activeCategory = null;
  state.activeMerchant = null;
  render();
}

// ────────────────────────────────────────────────────────────────────
// Main panel
// ────────────────────────────────────────────────────────────────────
function renderMainPanel() {
  renderBreadcrumb();
  if (state.view === 'categories') renderCategories();
  else if (state.view === 'all-merchants') renderAllMerchants();
  else if (state.view === 'merchants') renderMerchants();
  else renderTransactions();
}

// ── Breadcrumb ──────────────────────────────────────────────────────
function renderBreadcrumb() {
  const parts = [];
  let backBtn = '';

  if (state.view === 'categories') {
    parts.push(`<span class="crumb-current">Categorias</span>`);
  } else if (state.view === 'all-merchants') {
    parts.push(`<span class="crumb-current">Todos os Comerciantes</span>`);
  } else if (state.view === 'merchants') {
    backBtn = `<button class="back-btn" onclick="goToCategories()" title="Voltar">←</button>`;
    parts.push(`<span class="crumb-current">${esc(catLabel(state.activeCategory))}</span>`);
  } else {
    // transactions — back destination depends on origin
    if (state.activeCategory === null) {
      backBtn = `<button class="back-btn" onclick="goToAllMerchants()" title="Voltar">←</button>`;
    } else {
      backBtn = `<button class="back-btn" onclick="goToMerchants()" title="Voltar">←</button>`;
    }
    parts.push(`<span class="crumb-current">${esc(state.activeMerchant)}</span>`);
  }

  const breadcrumbHtml = backBtn + `<div class="crumbs">${parts.join('')}</div>`;
  el('main-panel').innerHTML = `<div id="breadcrumb">${breadcrumbHtml}</div><div id="view-content"></div>`;
}

function goToCategories() {
  state.view = state.grouping === 'all-merchants' ? 'all-merchants' : 'categories';
  state.activeCategory = null;
  state.activeMerchant = null;
  renderMainPanel();
}

function goToAllMerchants() {
  state.view = 'all-merchants';
  state.activeCategory = null;
  state.activeMerchant = null;
  renderMainPanel();
}

function goToMerchants() {
  state.view = 'merchants';
  state.activeMerchant = null;
  renderMainPanel();
}

function setGrouping(g) {
  state.grouping = g;
  state.view = g;
  state.activeCategory = null;
  state.activeMerchant = null;
  renderMainPanel();
}

// ── Categories ──────────────────────────────────────────────────────
function renderCategories() {
  const catData = state.data?.category_totals?.[state.activeMonth] ?? {};
  const periodTotal = Object.values(catData).reduce((sum, c) => sum + c.total, 0);

  // Sort by absolute total descending
  const sorted = Object.entries(catData).sort((a, b) => Math.abs(b[1].total) - Math.abs(a[1].total));

  const cards = sorted.map(([cat, data]) => {
    const warning = getCategoryWarning(cat);
    const warnBadge = warning
      ? `<span class="warn-badge" onmouseenter="showTooltip('${esc(warning)}', event)" onmouseleave="hideTooltip()">⚠️</span>`
      : '';
    const totalClass = data.total >= 0 ? 'positive' : '';
    return `
      <div class="category-card" onclick="openCategory('${esc(cat)}')">
        <div class="cat-name">${esc(catLabel(cat))} ${warnBadge}</div>
        <div class="cat-total ${totalClass}">${formatEuro(data.total)}</div>
        <div class="cat-count">${data.tx_count} transaç${data.tx_count === 1 ? 'ão' : 'ões'}</div>
      </div>`;
  }).join('');

  const view = el('view-content') ?? el('main-panel');
  view.innerHTML = `
    <div class="grouping-toggle">
      <button class="grouping-btn active" onclick="setGrouping('categories')">Por Categoria</button>
      <button class="grouping-btn" onclick="setGrouping('all-merchants')">Por Comerciante</button>
    </div>
    <div id="period-total">
      <span class="label">${state.activeMonth === 'Todos' ? 'Total gasto' : 'Total — ' + formatMonth(state.activeMonth)}</span>
      ${formatEuro(periodTotal)}
    </div>
    <div class="pie-chart-wrap" id="cat-pie-container"></div>
    <div class="category-grid">${cards}</div>`;
  drawCategoryPie(sorted);
}

function openCategory(cat) {
  state.activeCategory = cat;
  state.view = 'merchants';
  renderMainPanel();
}

// ── All Merchants (flat, cross-category) ─────────────────────────────
function getAllMerchantsForMonth(month) {
  const catTotals = state.data?.merchant_totals?.[month] ?? {};
  const merged = {};
  for (const [cat, merchants] of Object.entries(catTotals)) {
    const effectiveCat = cat;
    for (const m of merchants) {
      const key = m.merchant;
      if (merged[key]) {
        merged[key].total += m.total;
        merged[key].tx_count += m.tx_count;
      } else {
        merged[key] = { ...m, category: effectiveCat };
      }
    }
  }
  return Object.values(merged).sort((a, b) => Math.abs(b.total) - Math.abs(a.total));
}

function renderAllMerchants() {
  const merchants = getAllMerchantsForMonth(state.activeMonth);
  const periodTotal = merchants.reduce((s, m) => s + m.total, 0);

  const rows = merchants.map(m => {
    const warning = getMerchantWarning(m.merchant);
    const warnBadge = warning
      ? `<span class="warn-badge" onmouseenter="showTooltip('${esc(warning)}', event)" onmouseleave="hideTooltip()">⚠️</span>`
      : '';
    const totalClass = m.total >= 0 ? 'positive' : '';
    const catEmoji = (state.data?.category_emojis ?? {})[m.category] ?? '';
    const catTag = `<span class="merchant-category-tag">${catEmoji ? catEmoji + ' ' : ''}${esc(m.category)}</span>`;

    return `
      <div class="merchant-row" onclick="openMerchantFromAll('${esc(m.merchant)}')">
        <div class="m-name">
          ${warnBadge}<span>${esc(m.merchant)}</span>
          ${catTag}
        </div>
        <div class="m-right">
          <span class="m-count">${m.tx_count}×</span>
          <span class="m-total ${totalClass}">${formatEuro(m.total)}</span>
        </div>
      </div>`;
  }).join('');

  const slices = merchants
    .filter(m => m.total < 0)
    .map((m, i) => ({ label: m.merchant, value: Math.abs(m.total), color: MERCHANT_PALETTE[i % MERCHANT_PALETTE.length] }));

  const view = el('view-content');
  view.innerHTML = `
    <div class="grouping-toggle">
      <button class="grouping-btn" onclick="setGrouping('categories')">Por Categoria</button>
      <button class="grouping-btn active" onclick="setGrouping('all-merchants')">Por Comerciante</button>
    </div>
    <div id="period-total">
      <span class="label">${state.activeMonth === 'Todos' ? 'Total gasto' : 'Total — ' + formatMonth(state.activeMonth)}</span>
      ${formatEuro(periodTotal)}
    </div>
    <div class="pie-chart-wrap" id="merchant-all-pie-container"></div>
    <div class="merchant-list">${rows || '<p style="color:var(--text2);padding:.5rem 0">Sem transações.</p>'}</div>`;
  _renderPieChart('merchant-all-pie-container', slices);
}

function openMerchantFromAll(merchant) {
  state.activeMerchant = merchant;
  state.activeCategory = null;  // signals we came from all-merchants
  state.view = 'transactions';
  renderMainPanel();
}

// ── Merchants ────────────────────────────────────────────────────────
function renderMerchants() {
  const merchants = state.data?.merchant_totals?.[state.activeMonth]?.[state.activeCategory] ?? [];
  const allCategories = Object.keys(state.data?.category_totals?.['Todos'] ?? {}).sort();

  const rows = merchants.map(m => {
    const warning = getMerchantWarning(m.merchant);
    const warnBadge = warning
      ? `<span class="warn-badge" onmouseenter="showTooltip('${esc(warning)}', event)" onmouseleave="hideTooltip()">⚠️</span>`
      : '';
    const totalClass = m.total >= 0 ? 'positive' : '';

    // Get the effective category (edited or original)
    const editKey = getEditKey(state.activeMonth, m.merchant);
    const effectiveCategory = state.edits[editKey] ?? state.activeCategory;
    const isEdited = state.edits[editKey] !== undefined;
    const editedBadge = isEdited ? ' <span style="font-size:.7rem; color:var(--accent)">●</span>' : '';

    const categoryOptions = allCategories.map(cat =>
      `<option value="${cat}" ${effectiveCategory === cat ? 'selected' : ''}>${esc(catLabel(cat))}</option>`
    ).join('');

    return `
      <div class="merchant-row">
        <div class="m-name" onclick="openMerchant('${esc(m.merchant)}')">
          ${warnBadge}<span>${esc(m.merchant)}</span>
        </div>
        <div class="m-right" style="gap: 1rem;">
          <select class="merchant-category-select" onchange="changeMerchantCategory('${esc(m.merchant)}', this.value)" onclick="event.stopPropagation()">
            ${categoryOptions}
          </select>
          <span class="m-count">${m.tx_count}×</span>
          <span class="m-total ${totalClass}">${formatEuro(m.total)}</span>
        </div>
        <div style="font-size:.8rem; color:var(--text2); min-width:3rem; text-align:right;">${editedBadge}</div>
      </div>`;
  }).join('');

  const view = el('view-content');
  view.innerHTML = `
    <div class="list-header">${esc(catLabel(state.activeCategory))} — ${state.activeMonth === 'Todos' ? 'todos os meses' : formatMonth(state.activeMonth)}</div>
    <div class="pie-chart-wrap" id="merchant-pie-container"></div>
    <div class="merchant-list">${rows || '<p style="color:var(--text2);padding:.5rem 0">Sem transações.</p>'}</div>`;
  drawMerchantPie(merchants);
}

function changeMerchantCategory(merchant, newCategory) {
  // Only allow editing if not in 'Todos' view
  if (state.activeMonth === 'Todos') {
    alert('Selecciona um mês específico para editar categorias.');
    renderMerchants();
    return;
  }
  saveEditToGist(state.activeMonth, merchant, newCategory);
  // Re-render to show the edited badge
  renderMerchants();
}

function openMerchant(merchant) {
  state.activeMerchant = merchant;
  state.view = 'transactions';
  renderMainPanel();
}

// ── Transactions ─────────────────────────────────────────────────────
function renderTransactions() {
  let txs = state.data?.transactions?.filter(tx =>
    (state.activeCategory === null || tx.category === state.activeCategory) &&
    tx.merchant === state.activeMerchant &&
    (state.activeMonth === 'Todos' || tx.month === state.activeMonth)
  ) ?? [];

  // Sort newest first
  txs = txs.slice().sort((a, b) => b.date.localeCompare(a.date));

  const rows = txs.map(tx => {
    const amtClass = tx.is_refund ? 'amount-pos' : 'amount-neg';
    const refundBadge = tx.is_refund ? '<span class="refund-badge">reembolso</span>' : '';
    const rowClass = tx.is_refund ? ' class="is-refund"' : '';
    const savedDesc = esc(state.descriptions[getTxKey(tx)] ?? '');
    return `
      <tr${rowClass}>
        <td class="tx-date">${formatDate(tx.date)}</td>
        <td>${esc(tx.description)}${refundBadge}</td>
        <td><input type="text" class="tx-desc-input"
          data-txdate="${esc(tx.date)}"
          data-txdesc="${esc(tx.description)}"
          data-txamount="${tx.amount}"
          value="${savedDesc}"
          placeholder="Nota…" /></td>
        <td style="text-align:right"><span class="${amtClass}">${formatEuro(tx.amount)}</span></td>
      </tr>`;
  }).join('');

  const total = txs.reduce((sum, tx) => sum + tx.amount, 0);
  const totalClass = total >= 0 ? 'amount-pos' : 'amount-neg';

  const view = el('view-content');
  view.innerHTML = `
    <div class="list-header">
      ${esc(state.activeMerchant)} — ${state.activeMonth === 'Todos' ? 'todos os meses' : formatMonth(state.activeMonth)}
      &nbsp;·&nbsp; ${txs.length} transaç${txs.length === 1 ? 'ão' : 'ões'}
      &nbsp;·&nbsp; <span class="${totalClass}">${formatEuro(total)}</span>
    </div>
    <div class="tx-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Transação</th>
            <th>Descrição</th>
            <th style="text-align:right">Valor</th>
          </tr>
        </thead>
        <tbody>${rows || '<tr><td colspan="4" style="color:var(--text2);padding:.75rem">Sem transações.</td></tr>'}</tbody>
      </table>
    </div>`;

  view.querySelector('.tx-table-wrap table')?.addEventListener('blur', e => {
    if (!e.target.classList.contains('tx-desc-input')) return;
    const t = e.target;
    saveTxDescriptionToGist(
      { date: t.dataset.txdate, description: t.dataset.txdesc, amount: parseFloat(t.dataset.txamount) },
      t.value
    );
  }, true);
}

// Convert a narrative markdown string to safe HTML.
// Handles: **bold**, pipe tables, - bullet lists, double-newline paragraphs.
function narrativeToHtml(text) {
  if (!text) return '';
  const lines = text.split('\n');
  let html = '';
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // Pipe table: collect all consecutive table lines
    if (line.trim().startsWith('|')) {
      const tableLines = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        tableLines.push(lines[i]);
        i++;
      }
      // First row = header, second row = separator (skip), rest = body
      const rows = tableLines.filter(l => !/^\s*\|[\s\-:]+\|/.test(l));
      if (rows.length > 0) {
        const parseRow = r => r.split('|').slice(1, -1).map(c => c.trim());
        const head = parseRow(rows[0]);
        const body = rows.slice(1);
        html += '<table>';
        html += '<thead><tr>' + head.map(h => `<th>${inlineToHtml(h)}</th>`).join('') + '</tr></thead>';
        if (body.length) {
          html += '<tbody>' + body.map(r => '<tr>' + parseRow(r).map(c => `<td>${inlineToHtml(c)}</td>`).join('') + '</tr>').join('') + '</tbody>';
        }
        html += '</table>';
      }
      continue;
    }
    // Bullet list item
    if (/^\s*-\s/.test(line)) {
      html += '<ul>';
      while (i < lines.length && /^\s*-\s/.test(lines[i])) {
        html += '<li>' + inlineToHtml(lines[i].replace(/^\s*-\s/, '')) + '</li>';
        i++;
      }
      html += '</ul>';
      continue;
    }
    // Blank line — ignored, paragraph breaks handled by grouping
    if (line.trim() === '') { i++; continue; }
    // Normal paragraph line
    html += '<p>' + inlineToHtml(line) + '</p>';
    i++;
  }
  return html;
}

function inlineToHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function renderAnalysisPanel() {
  const ins = state.data?.insights;
  if (!ins || !ins.priorities) {
    el('analysis-panel').innerHTML = '<div class="state-error">Sem dados de análise. Corre /finances-savings-analysis primeiro.</div>';
    return;
  }

  const verdictClass = v => v === 'Keep' ? 'verdict-keep' : v === 'Potentially unused' ? 'verdict-unused' : 'verdict-review';
  const verdictLabel = v => v === 'Keep' ? 'Manter' : v === 'Potentially unused' ? 'Não usado?' : 'Rever';

  // ── Analysis date ───────────────────────────────────────────────
  const analysisDateHtml = ins.generated_at
    ? `<div class="analysis-date-bar">Análise feita em ${formatDatePt(ins.generated_at)}</div>`
    : '';

  // ── Header ──────────────────────────────────────────────────────
  const p = ins.period ?? {};
  const headerHtml = p.total_spent ? `
    <div class="analysis-header">
      <div class="meta">
        ${p.from ? `${p.from} – ${p.to}` : ''}
        ${p.total_spent ? ` · Total gasto: <strong>${_formatEuroSimple(Math.abs(p.total_spent))}</strong>` : ''}
        ${p.avg_monthly ? ` · Média/mês: <strong>${_formatEuroSimple(Math.abs(p.avg_monthly))}</strong>` : ''}
      </div>
      ${p.top_takeaway ? `<div class="takeaway">${inlineToHtml(p.top_takeaway)}</div>` : ''}
    </div>` : '';

  // ── Spending overview table ──────────────────────────────────────
  const overviewRows = (ins.spending_overview ?? []).map(o => {
    const trend = o.trend ?? '';
    const trendColor = trend === '↑' ? 'color:var(--warn)' : trend === '↓' ? 'color:var(--green)' : 'color:var(--text2)';
    return `<tr>
      <td>${esc(catLabel(o.category))}</td>
      <td class="num" style="font-weight:600">${_formatEuroSimple(Math.abs(o.total))}</td>
      <td class="num" style="color:var(--text2)">${o.pct_of_total?.toFixed(1)}%</td>
      <td class="num" style="color:var(--text2)">${_formatEuroSimple(Math.abs(o.avg_monthly))}/mês</td>
      ${trend ? `<td class="num" style="${trendColor};font-weight:700">${trend}</td>` : '<td></td>'}
    </tr>`;
  }).join('');

  const overviewHtml = overviewRows ? `
    <div class="analysis-section">
      <h2>Panorama de gastos</h2>
      <table class="overview-table">
        <thead><tr>
          <th>Categoria</th>
          <th style="text-align:right">Total</th>
          <th style="text-align:right">% total</th>
          <th style="text-align:right">Avg/mês</th>
          <th style="text-align:right">Tendência</th>
        </tr></thead>
        <tbody>${overviewRows}</tbody>
      </table>
      ${ins.spending_overview_narrative ? `<p style="margin-top:.8rem;font-size:.85rem;color:var(--text2);line-height:1.55">${inlineToHtml(ins.spending_overview_narrative)}</p>` : ''}
    </div>` : '';

  // ── Monthly evolution ────────────────────────────────────────────
  let evolutionHtml = '';
  const ev = ins.monthly_evolution;
  if (ev && ev.months && ev.months.length > 1 && ev.categories) {
    const months = ev.months;
    const cats = Object.keys(ev.categories);
    const formatMonthLabel = m => {
      const [y, mo] = m.split('-');
      const names = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      return names[parseInt(mo)] ?? m;
    };
    const CHART_COLORS = [
      '#4f46e5','#16a34a','#d97706','#e11d48','#0891b2',
      '#7c3aed','#059669','#f59e0b','#db2777','#0284c7',
      '#6d28d9','#10b981','#b45309','#be185d','#0369a1',
    ];
    const datasets = cats.map((cat, i) => ({
      label: catLabel(cat),
      data: ev.categories[cat].map(v => v ? Math.abs(v) : null),
      borderColor: CHART_COLORS[i % CHART_COLORS.length],
      backgroundColor: CHART_COLORS[i % CHART_COLORS.length] + '22',
      borderWidth: 2,
      pointRadius: 4,
      pointHoverRadius: 6,
      tension: 0.3,
      spanGaps: true,
    }));
    const chartData = JSON.stringify({ labels: months.map(formatMonthLabel), datasets });
    const commentary = (ev.commentary ?? []).map(c => `<li>${inlineToHtml(c)}</li>`).join('');
    evolutionHtml = `
      <div class="analysis-section">
        <h2>Evolução mensal</h2>
        <div style="position:relative;height:340px;margin-bottom:1rem">
          <canvas data-evo-chart="${esc(chartData)}"></canvas>
        </div>
        ${commentary ? `<ul class="commentary-list">${commentary}</ul>` : ''}
      </div>`;
  }

  // ── Subscriptions ────────────────────────────────────────────────
  const totalSubs = ins.subscriptions_total_monthly
    ?? (ins.subscriptions ?? []).reduce((s, x) => s + x.monthly_cost, 0);
  const allSubs = ins.subscriptions ?? [];
  const keepSubs = allSubs.filter(s => s.verdict === 'Keep');
  const actionSubs = allSubs.filter(s => s.verdict !== 'Keep');
  const keepLine = keepSubs.length
    ? `<div style="font-size:.85rem;color:var(--text2);margin-bottom:1rem;line-height:1.6"><strong>Manter sem alteração:</strong> ${keepSubs.map(s => `${esc(s.name)} (${_formatEuroSimple(s.monthly_cost)})`).join(', ')} = ${_formatEuroSimple(keepSubs.reduce((s, x) => s + x.monthly_cost, 0))}/mês</div>`
    : '';
  const subsHtml = allSubs.length ? `
    <div class="analysis-section">
      <h2>Subscrições · ${_formatEuroSimple(totalSubs)}/mês</h2>
      ${keepLine}
      ${actionSubs.map(s => `
        <div class="narrative-card" style="margin-bottom:.6rem">
          <div style="display:flex;align-items:center;gap:.65rem;margin-bottom:${s.detail ? '.45rem' : '0'}">
            <span style="font-weight:600;font-size:.9rem">${esc(s.name)}</span>
            <span style="font-variant-numeric:tabular-nums;font-weight:600;font-size:.88rem">${_formatEuroSimple(s.monthly_cost)}/mês</span>
            <span style="color:var(--text2);font-size:.78rem">${esc(s.category)}</span>
            <span class="verdict-badge ${verdictClass(s.verdict)}" style="margin-left:auto">${verdictLabel(s.verdict)}</span>
          </div>
          ${s.detail ? `<div class="narrative-body" style="margin-top:.3rem"><p>${inlineToHtml(s.detail)}</p></div>` : ''}
        </div>`).join('')}
    </div>` : '';

  // ── Category findings ────────────────────────────────────────────
  const findingsHtml = (ins.category_findings ?? []).length ? `
    <div class="analysis-section">
      <h2>Por categoria</h2>
      ${(ins.category_findings ?? []).map(f => `
        <div class="narrative-card">
          <h3>
            ${esc(catLabel(f.category))}
            ${f.total ? `<span class="total">${_formatEuroSimple(Math.abs(f.total))}</span>` : ''}
          </h3>
          <div class="narrative-body">${narrativeToHtml(f.narrative ?? f.finding ?? '')}</div>
        </div>`).join('')}
    </div>` : '';

  // ── Flagged categories ───────────────────────────────────────────
  const flaggedItems = [
    ...(ins.flagged_merchants ?? []).map(f => ({ title: f.merchant, body: f.warning })),
    ...(ins.flagged_categories ?? []).map(f => ({ title: f.category, body: f.finding }))
  ];
  const flaggedHtml = flaggedItems.length ? `
    <div class="analysis-section">
      <h2>Categorias a monitorar</h2>
      ${flaggedItems.map(f => `
        <div class="flag-card">
          <div class="flag-card-title">${esc(catLabel(f.title))}</div>
          <div class="flag-card-body">${inlineToHtml(f.body ?? '')}</div>
        </div>`).join('')}
    </div>` : '';

  // ── Priorities ───────────────────────────────────────────────────
  const prioritiesHtml = (ins.priorities ?? []).length ? `
    <div class="analysis-section">
      <h2>Prioridades de ação</h2>
      ${(ins.priorities ?? []).map(p => `
        <div class="priority-card">
          <div class="rank-title">${p.rank}. ${inlineToHtml(p.title)}</div>
          <div class="rank-detail">${inlineToHtml(p.detail)}</div>
        </div>`).join('')}
    </div>` : '';

  el('analysis-panel').innerHTML = `
    ${analysisDateHtml}
    ${headerHtml}
    ${overviewHtml}
    ${evolutionHtml}
    ${subsHtml}
    ${findingsHtml}
    ${flaggedHtml}
    ${prioritiesHtml}
  `;
  initEvoCharts();
}

// ────────────────────────────────────────────────────────────────────
// Evolution chart init (runs after innerHTML is set)
// ────────────────────────────────────────────────────────────────────
function initEvoCharts() {
  if (typeof Chart === 'undefined') return;
  document.querySelectorAll('canvas[data-evo-chart]').forEach(canvas => {
    if (canvas._chartInstance) canvas._chartInstance.destroy();
    const data = JSON.parse(canvas.getAttribute('data-evo-chart'));
    canvas._chartInstance = new Chart(canvas, {
      type: 'line',
      data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 12, padding: 16, font: { size: 12 } } },
          tooltip: {
            callbacks: {
              label: ctx => ' ' + ctx.dataset.label + ': ' + (ctx.parsed.y != null ? ctx.parsed.y.toFixed(2).replace('.', ',') + ' €' : '—'),
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 12 } } },
          y: {
            beginAtZero: true,
            ticks: { font: { size: 11 }, callback: v => v.toFixed(0) + ' €' },
            grid: { color: 'rgba(0,0,0,.06)' },
          }
        }
      }
    });
  });
}

// ────────────────────────────────────────────────────────────────────
// Priorities panel
// ────────────────────────────────────────────────────────────────────
function renderPrioritiesPanel() {
  const priorities = state.data?.insights?.priorities ?? [];
  if (!priorities.length) {
    el('priorities-panel').innerHTML = '';
    return;
  }

  const items = priorities.map(p => `
    <div class="priority-item">
      <div class="priority-rank">${p.rank}</div>
      <div class="priority-body">
        <div class="priority-title">${esc(p.title)}</div>
        <div class="priority-detail">${esc(p.short ?? p.detail)}</div>
      </div>
    </div>`).join('');

  el('priorities-panel').innerHTML = `<h2>Prioridades</h2>${items}`;
}

// ────────────────────────────────────────────────────────────────────
// HTML escaping
// ────────────────────────────────────────────────────────────────────
function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ────────────────────────────────────────────────────────────────────
// Init
// ────────────────────────────────────────────────────────────────────
function init() {
  state.token = localStorage.getItem('gh_token');
  if (!state.token) {
    showTokenScreen();
  } else {
    loadData();
  }
}

document.addEventListener('DOMContentLoaded', init);
